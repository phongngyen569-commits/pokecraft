name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - run: gradle build
        working-directory: pokemoncraft-mod-fabric-1_21_1
      - uses: actions/upload-artifact@v4
        with:
          name: pokemoncraft-jar
          path: pokemoncraft-mod-fabric-1_21_1/build/libs/pokemoncraft-1.0.0.jar
